[package]
name = "price-oracle"
version = "0.7.0"
authors = ["Vadim Ilin <vadim@fastnear.com>"]
edition = "2021"

[package.metadata.near.build]
wasm-opt-args = ["--enable-bulk-memory"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
abi = ["borsh/unstable__schema"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }
serde_json = "1.0"
schemars = "0.8"
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
near-sdk = { version =  "=5.17.2", features = ["legacy", "unit-testing"] }
approx = "0.5"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
