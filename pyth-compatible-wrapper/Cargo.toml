[package]
name = "pyth-compatible-wrapper"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.9.0", features = ["legacy"] }
schemars = "0.8"
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
