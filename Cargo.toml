[package]
name = "oracle-example"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "oracle-example"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-http-client = "0.2"
outlayer = "0.1"
anyhow = "1.0"

# Transaction signing (NEAR RPC)
ed25519-dalek = "2.1"
bs58 = "0.5"
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Shared sources library
oracle-example-sources = { path = "sources", features = ["wasi"] }

[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Link-time optimization
strip = true     # Strip debug symbols
