<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Prices - NEAR OutLayer</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-blue: #58a6ff;
            --accent-yellow: #d29922;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-radius: 8px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        .status-dot.error {
            background: var(--accent-red);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .config-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .config-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .config-field {
            flex: 1;
            min-width: 200px;
        }

        .config-field label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .config-field input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: monospace;
        }

        .config-field input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn {
            padding: 8px 16px;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .prices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .price-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s;
        }

        .price-card:hover {
            border-color: var(--accent-blue);
        }

        .price-card.error {
            border-color: var(--accent-red);
        }

        .price-card.stale {
            border-color: var(--accent-yellow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .token-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }

        .token-name {
            font-size: 16px;
            font-weight: 600;
        }

        .token-id {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .price-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .price-badge.fresh {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }

        .price-badge.stale {
            background: rgba(210, 153, 34, 0.15);
            color: var(--accent-yellow);
        }

        .price-value {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 12px;
            font-family: monospace;
        }

        .price-value.loading {
            color: var(--text-muted);
        }

        .price-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .detail-value {
            color: var(--text-secondary);
            font-family: monospace;
        }

        .sources-list {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .sources-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .source-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
        }

        .source-name {
            color: var(--text-secondary);
        }

        .source-price {
            font-family: monospace;
            color: var(--text-primary);
        }

        .error-message {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: var(--accent-red);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--bg-tertiary);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Circular refresh control */
        .refresh-ring {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            cursor: pointer;
            z-index: 100;
        }

        .refresh-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .refresh-ring .bg {
            fill: none;
            stroke: var(--bg-tertiary);
            stroke-width: 4;
        }

        .refresh-ring .progress {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s linear;
        }

        .refresh-ring .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.2;
        }

        .refresh-ring:hover .progress {
            stroke: var(--accent-green);
        }

        .refresh-ring:hover .center {
            color: var(--accent-green);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <div class="logo"></div>
                Oracle Prices
            </h1>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="config-panel">
            <div class="config-row">
                <div class="config-field">
                    <label>OutLayer API URL</label>
                    <input type="text" id="api-url" value="https://api.outlayer.fastnear.com" />
                </div>
                <div class="config-field">
                    <label>Project UUID</label>
                    <input type="text" id="project-uuid" value="p0000000000000003" />
                </div>
                <div class="config-field">
                    <label>Assets (comma-separated)</label>
                    <input type="text" id="assets" value="wrap.near,usdt.tether-token.near,17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1,aurora,nbtc.bridge.near,2260fac5e5542a773aa44fbcfedf7c193bc2c599.factory.bridge.near,6b175474e89094c44da98b954eedeac495271d0f.factory.bridge.near,4691937a7508860f876c9c0a2a617e7d9e945d4b.factory.bridge.near,853d955acef822db058eb8505911ed77f175b99e.factory.bridge.near,22.contract.portalbridge.near,zec.omft.near,token.rhealab.near" />
                </div>
                <button class="btn" id="refresh-btn" onclick="fetchPrices()">Refresh</button>
            </div>
        </div>

        <div id="error-container"></div>
        <div id="prices-grid" class="prices-grid"></div>

        <div class="footer">
            Prices fetched from <a href="https://outlayer.fastnear.com" target="_blank">NEAR OutLayer</a> public storage.
        </div>
    </div>

    <!-- Circular refresh control -->
    <div class="refresh-ring" id="refresh-ring" onclick="fetchPrices()" title="Click to refresh now">
        <svg viewBox="0 0 36 36">
            <circle class="bg" cx="18" cy="18" r="16"/>
            <circle class="progress" id="refresh-progress" cx="18" cy="18" r="16"
                stroke-dasharray="100.53" stroke-dashoffset="0"/>
        </svg>
        <div class="center" id="refresh-countdown">30s</div>
    </div>

    <script>
        // Token metadata from tokens.json (injected by server)
        const TOKENS = window.TOKENS || {};

        // Coingecko ID to display name mapping
        const COINGECKO_NAMES = {
            'near': 'NEAR',
            'ethereum': 'Ethereum',
            'tether': 'Tether USD',
            'usd-coin': 'USD Coin',
            'bitcoin': 'Bitcoin',
            'wrapped-bitcoin': 'Wrapped BTC',
            'dai': 'DAI',
            'aurora-near': 'Aurora',
            'woo-network': 'WOO',
            'frax': 'FRAX',
            'solana': 'Solana',
            'zcash': 'Zcash',
        };

        // Coingecko ID to icon mapping
        const COINGECKO_ICONS = {
            'near': 'N',
            'ethereum': 'E',
            'tether': 'T',
            'usd-coin': 'C',
            'bitcoin': 'B',
            'wrapped-bitcoin': 'W',
            'dai': 'D',
            'aurora-near': 'A',
            'woo-network': 'W',
            'frax': 'F',
            'solana': 'S',
            'zcash': 'Z',
        };

        let refreshInterval;
        const RECENCY_DURATION_SEC = 300; // 5 minutes

        function getConfig() {
            return {
                apiUrl: document.getElementById('api-url').value.trim(),
                projectUuid: document.getElementById('project-uuid').value.trim(),
                assets: document.getElementById('assets').value.split(',').map(a => a.trim()).filter(a => a),
            };
        }

        function formatPrice(price) {
            if (price === null || price === undefined) return '---';
            // price is a direct number from API
            if (price >= 1) {
                return '$' + price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            }
            return '$' + price.toFixed(6);
        }

        function formatTimestamp(ts) {
            if (!ts) return '---';
            const date = new Date(ts * 1000);
            return date.toLocaleTimeString();
        }

        function getAgeSeconds(ts) {
            if (!ts) return Infinity;
            return Math.floor(Date.now() / 1000) - ts;
        }

        function formatAge(ts) {
            const age = getAgeSeconds(ts);
            if (age === Infinity) return '---';
            if (age < 60) return `${age}s ago`;
            const mins = Math.floor(age / 60);
            const secs = age % 60;
            if (age < 3600) return `${mins}m ${secs}s ago`;
            return `${Math.floor(age / 3600)}h ${mins % 60}m ago`;
        }

        function isFresh(ts) {
            return getAgeSeconds(ts) <= RECENCY_DURATION_SEC;
        }

        function getTokenIcon(assetId) {
            const token = TOKENS[assetId];
            if (token?.coingecko) {
                return COINGECKO_ICONS[token.coingecko] || token.coingecko.charAt(0).toUpperCase();
            }
            return assetId.charAt(0).toUpperCase();
        }

        function truncateId(id, maxLen = 20) {
            if (id.length <= maxLen) return id;
            const half = Math.floor((maxLen - 3) / 2);
            return id.slice(0, half) + '...' + id.slice(-half);
        }

        function getTokenName(assetId) {
            const token = TOKENS[assetId];
            if (token?.coingecko) {
                return COINGECKO_NAMES[token.coingecko] || token.coingecko.replace(/-/g, ' ');
            }
            // Fallback: extract name from asset ID
            const parts = assetId.split('.');
            if (parts.length > 1) return parts[0];
            return assetId.substring(0, 8) + '...';
        }

        function getTokenDecimals(assetId) {
            return TOKENS[assetId]?.decimals || 0;
        }

        function isStablecoin(assetId) {
            return TOKENS[assetId]?.stablecoin || false;
        }

        function setStatus(text, isError = false) {
            document.getElementById('status-text').textContent = text;
            const dot = document.querySelector('.status-dot');
            dot.classList.toggle('error', isError);
        }

        function showError(message) {
            document.getElementById('error-container').innerHTML = `
                <div class="error-message">${message}</div>
            `;
        }

        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }

        function renderPriceCard(assetId, data, error = null) {
            const fresh = data && isFresh(data.timestamp);
            const cardClass = error ? 'error' : (data && !fresh ? 'stale' : '');

            let sourcesHtml = '';
            if (data && data.sources && data.sources.length > 0) {
                sourcesHtml = `
                    <div class="sources-list">
                        <div class="sources-title">Sources</div>
                        ${data.sources.map(s => `
                            <div class="source-item">
                                <span class="source-name">${s.name}</span>
                                <span class="source-price">$${s.price.toFixed(4)}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="price-card ${cardClass}">
                    <div class="card-header">
                        <div class="token-info">
                            <div class="token-icon">${getTokenIcon(assetId)}</div>
                            <div>
                                <div class="token-name">${getTokenName(assetId)}</div>
                                <div class="token-id" title="${assetId}">${truncateId(assetId)}</div>
                            </div>
                        </div>
                        ${data ? `
                            <span class="price-badge ${fresh ? 'fresh' : 'stale'}">
                                ${fresh ? 'Fresh' : 'Stale'}
                            </span>
                        ` : ''}
                    </div>

                    <div class="price-value ${!data ? 'loading' : ''}">
                        ${error ? 'Error' : (data ? formatPrice(data.price) : '---')}
                    </div>

                    <div class="price-details">
                        <div class="detail-item">
                            <span class="detail-label">Updated</span>
                            <span class="detail-value">${data ? formatAge(data.timestamp) : '---'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Time</span>
                            <span class="detail-value">${data ? formatTimestamp(data.timestamp) : '---'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Method</span>
                            <span class="detail-value">${data?.aggregation_method || '---'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Sources</span>
                            <span class="detail-value">${data?.sources?.length || 0}</span>
                        </div>
                    </div>

                    ${sourcesHtml}

                    ${error ? `<div style="color: var(--accent-red); font-size: 12px; margin-top: 12px;">${error}</div>` : ''}
                </div>
            `;
        }

        async function fetchPrices() {
            // Reset countdown timer on manual refresh
            refreshCountdown = REFRESH_INTERVAL_SEC;
            updateRefreshRing();

            const config = getConfig();

            if (!config.projectUuid) {
                showError('Please enter Project UUID');
                return;
            }

            if (!config.assets.length) {
                showError('Please enter at least one asset');
                return;
            }

            clearError();
            setStatus('Fetching prices...');
            document.getElementById('refresh-btn').disabled = true;

            const grid = document.getElementById('prices-grid');
            const results = {};

            // Build keys for batch request
            const keys = config.assets.map(assetId => `price:${assetId}`);

            try {
                const response = await fetch(`${config.apiUrl}/public/storage/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_uuid: config.projectUuid,
                        keys: keys
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const batchResult = await response.json();

                // Parse results
                config.assets.forEach((assetId, i) => {
                    const key = keys[i];
                    const item = batchResult.results[key];
                    if (item && item.exists && item.value) {
                        try {
                            const json = atob(item.value);
                            results[assetId] = { data: JSON.parse(json) };
                        } catch (e) {
                            results[assetId] = { error: 'Parse error' };
                        }
                    } else {
                        results[assetId] = { error: 'Not found' };
                    }
                });
            } catch (err) {
                config.assets.forEach(assetId => {
                    results[assetId] = { error: err.message };
                });
            }

            // Render all cards
            grid.innerHTML = config.assets.map(assetId => {
                const result = results[assetId];
                return renderPriceCard(assetId, result?.data, result?.error);
            }).join('');

            const freshCount = Object.values(results).filter(r => r.data && isFresh(r.data.timestamp)).length;
            setStatus(`${freshCount}/${config.assets.length} fresh prices`, freshCount < config.assets.length);
            document.getElementById('refresh-btn').disabled = false;
        }

        // Refresh timer
        const REFRESH_INTERVAL_SEC = 30;
        let refreshCountdown = REFRESH_INTERVAL_SEC;
        let countdownInterval;

        function updateRefreshRing() {
            const progress = document.getElementById('refresh-progress');
            const countdown = document.getElementById('refresh-countdown');
            const circumference = 2 * Math.PI * 16; // r=16
            const offset = circumference * (1 - refreshCountdown / REFRESH_INTERVAL_SEC);
            progress.style.strokeDashoffset = offset;
            countdown.textContent = `${refreshCountdown}s`;
        }

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (countdownInterval) clearInterval(countdownInterval);

            refreshCountdown = REFRESH_INTERVAL_SEC;
            updateRefreshRing();

            countdownInterval = setInterval(() => {
                refreshCountdown--;
                updateRefreshRing();
                if (refreshCountdown <= 0) {
                    fetchPrices();
                    refreshCountdown = REFRESH_INTERVAL_SEC;
                }
            }, 1000);
        }

        // Load config from ENV_CONFIG or URL params
        function loadConfig() {
            // First try injected config from server
            if (window.ENV_CONFIG) {
                if (window.ENV_CONFIG.apiUrl) {
                    document.getElementById('api-url').value = window.ENV_CONFIG.apiUrl;
                }
                if (window.ENV_CONFIG.projectUuid) {
                    document.getElementById('project-uuid').value = window.ENV_CONFIG.projectUuid;
                }
                if (window.ENV_CONFIG.assets) {
                    document.getElementById('assets').value = window.ENV_CONFIG.assets;
                }
            }

            // URL params override
            const params = new URLSearchParams(window.location.search);
            if (params.has('uuid')) {
                document.getElementById('project-uuid').value = params.get('uuid');
            }
            if (params.has('assets')) {
                document.getElementById('assets').value = params.get('assets');
            }
            if (params.has('api')) {
                document.getElementById('api-url').value = params.get('api');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            fetchPrices();
            startAutoRefresh();
        });

        // Refresh on config change
        ['api-url', 'project-uuid', 'assets'].forEach(id => {
            document.getElementById(id).addEventListener('change', fetchPrices);
        });
    </script>
</body>
</html>
