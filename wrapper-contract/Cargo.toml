[package]
name = "oracle-wrapper-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }
serde_json = "1.0"
schemars = "0.8"
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
