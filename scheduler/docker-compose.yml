version: '3.8'

services:
  oracle-scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    env_file:
      - .env
    volumes:
      - ../tokens.json:/etc/oracle-scheduler/tokens.json:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
